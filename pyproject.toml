[project]
name = "youtuberag"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "networkx>=3.7",
    "plotly>=7.1.0",
    "spacy>=3.8.16",
    "en-core-web-sm",
    "scrapetube>=2.6.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.8.19",
    "polars>=2.0.0",
    "nbformat>=5.11.1",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "bm25s>=0.3.15",
    "bm25>=0.3.15",
    "numba>=0.68.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
